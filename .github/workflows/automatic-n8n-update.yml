name: Scheduled n8n Nodes Generation

on:
  schedule:
    # Run every Tuesday at 9:00 AM UTC
    - cron: "0 9 * * 2"
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_NAME: automated/update-n8n-nodes

jobs:
  generate-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Checkout stable n8n submodule
        run: |
          n8n_metadata=$(curl -fsSL https://registry.npmjs.org/n8n/stable)
          n8n_stable_version=$(jq -r '.version' <<< "$n8n_metadata")
          n8n_core_version=$(jq -r '.dependencies["n8n-core"]' <<< "$n8n_metadata")
          n8n_workflow_version=$(jq -r '.dependencies["n8n-workflow"]' <<< "$n8n_metadata")
          n8n_langchain_version=$(jq -r '.dependencies["@n8n/n8n-nodes-langchain"]' <<< "$n8n_metadata")
          n8n_ai_utilities_version=$(jq -r '.dependencies["@n8n/ai-utilities"]' <<< "$n8n_metadata")
          n8n_backend_network_version=$(jq -r '.dependencies["@n8n/backend-network"]' <<< "$n8n_metadata")

          git -C packages/n8n-kit/vendor/n8n fetch --tags origin "refs/tags/n8n@$n8n_stable_version:refs/tags/n8n@$n8n_stable_version"
          git -C packages/n8n-kit/vendor/n8n checkout "n8n@$n8n_stable_version"
          submodule_version=$(git -C packages/n8n-kit/vendor/n8n rev-parse HEAD)

          echo "n8n stable version: $n8n_stable_version"
          echo "Submodule version: $submodule_version"
          echo "SUBMODULE_VERSION=$submodule_version" >> $GITHUB_ENV
          echo "N8N_STABLE_VERSION=$n8n_stable_version" >> $GITHUB_ENV
          echo "N8N_CORE_VERSION=$n8n_core_version" >> $GITHUB_ENV
          echo "N8N_WORKFLOW_VERSION=$n8n_workflow_version" >> $GITHUB_ENV
          echo "N8N_LANGCHAIN_VERSION=$n8n_langchain_version" >> $GITHUB_ENV
          echo "N8N_AI_UTILITIES_VERSION=$n8n_ai_utilities_version" >> $GITHUB_ENV
          echo "N8N_BACKEND_NETWORK_VERSION=$n8n_backend_network_version" >> $GITHUB_ENV

      - name: Check if submodules have updates
        id: check-updates
        run: |
          if git diff --quiet HEAD; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing PR
        if: steps.check-updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_pr=$(gh pr list --head "automated/update-n8n-nodes" --json number --jq '.[0].number' || echo "")
          echo "EXISTING_PR=$existing_pr" >> $GITHUB_ENV

      - name: Switch to existing branch or create new one
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          if [ ! -z "$EXISTING_PR" ]; then
            echo "Reusing existing branch and PR #$EXISTING_PR"
            git fetch origin automated/update-n8n-nodes
            git checkout $BRANCH_NAME
            git pull 
          else
            echo "Creating new branch"
            git checkout -b $BRANCH_NAME
          fi

      - name: Setup Node
        if: steps.check-updates.outputs.has_updates == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        if: steps.check-updates.outputs.has_updates == 'true'
        uses: oven-sh/setup-bun@v2
      - name: Update kit dependencies
        if: steps.check-updates.outputs.has_updates == 'true'
        working-directory: packages/n8n-kit
        run: |
          bun add --dev \
            "n8n-core@$N8N_CORE_VERSION" \
            "n8n-workflow@$N8N_WORKFLOW_VERSION" \
            "@n8n/n8n-nodes-langchain@$N8N_LANGCHAIN_VERSION" \
            "@n8n/ai-utilities@$N8N_AI_UTILITIES_VERSION" \
            "@n8n/backend-network@$N8N_BACKEND_NETWORK_VERSION"
      - name: Update cli dependencies
        if: steps.check-updates.outputs.has_updates == 'true'
        working-directory: packages/n8n-cli
        run: bun add --dev "n8n-core@$N8N_CORE_VERSION"
      - name: Install dependencies
        if: steps.check-updates.outputs.has_updates == 'true'
        run: bun install --frozen-lockfile

      - name: Run generate command
        if: steps.check-updates.outputs.has_updates == 'true'
        working-directory: packages/n8n-kit
        run: |
          bun run generate

      - name: Run format command
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          bun run format

      - name: Build packages
        continue-on-error: true
        if: steps.check-updates.outputs.has_updates == 'true'
        run: bun run --filter '*' build

      - name: Build examples using new nodes
        continue-on-error: true
        if: steps.check-updates.outputs.has_updates == 'true'
        run: bash scripts/build-and-check-examples.sh bun || true

      - name: Add changeset
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          # remove previous changesets
          rm .changeset/automated-n8n-nodes-update-*.md || true

          # Create changeset file
          changeset_file=".changeset/automated-n8n-nodes-update-$(date +%Y%m%d-%H%M%S).md"

          cat > $changeset_file << EOF
          ---
          "@vahor/n8n-kit": minor
          ---

          Automated update of n8n nodes from upstream stable release [$N8N_STABLE_VERSION](https://github.com/n8n-io/n8n/tree/n8n@$N8N_STABLE_VERSION)
          EOF

          echo "Created changeset: $changeset_file"

      - name: Commit changes
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          git add .
          git commit -m "chore: automated n8n nodes update" --allow-empty

      - name: Push changes and create PR
        if: steps.check-updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          git push --set-upstream origin $BRANCH_NAME

          pr_title="chore: automated n8n nodes update $(date +%Y-%m-%d)"
          pr_body="## Automated n8n Nodes Update

            This PR was automatically generated to update n8n nodes.

            Updated to n8n stable version [$N8N_STABLE_VERSION](https://github.com/n8n-io/n8n/tree/n8n@$N8N_STABLE_VERSION).

            n8n dependency versions are read from the published n8n stable package.

            ---
            *Generated in $JOB_URL*"

          if [ ! -z "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit $EXISTING_PR --title "$pr_title" --body "$pr_body"
          else
            echo "Creating new PR"
            gh pr create \
              --title "$pr_title" \
              --body "$pr_body" \
              --head $BRANCH_NAME \
              --base main
          fi

      - name: No updates needed
        if: steps.check-updates.outputs.has_updates == 'false'
        run: |
          echo "No submodule updates found. Skipping PR creation."
